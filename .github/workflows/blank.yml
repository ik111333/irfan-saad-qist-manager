name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -o irfan_saad_qist_android_project_with_cloud_build.zip
          cd irfan_saad_qist_android_project
          echo "Project extracted"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd irfan_saad_qist_android_project
          gradle assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Irfan-Saad-Qist-Manager-APK
          path: irfan_saad_qist_android_project/app/build/outputs/apk/debug/app-debug.apk
